# ui.skylanex.com — UI Bible design-system docs (/var/www/ui-bible/dist)
#
# Deployed to /etc/nginx/conf.d/ui.skylanex.com.conf
#
# ---------------------------------------------------------------------------
# Deploying an update
#
#     cd /var/www/ui-bible && git pull
#     sudo systemctl restart ui-bible    # rebuilds dist/ — see ui-bible.service
#     sudo systemctl reload nginx        # only needed if this file changed
#
# `dist/` is gitignored, so the build has to run on the host and a pull alone
# changes nothing a visitor can see. Node 22 and npm 10 are already installed.
# ---------------------------------------------------------------------------
#
# TLS: certificate issued for the bare subdomain via the shared webroot,
# matching how skylanex.com is set up:
#
#     certbot certonly --webroot -w /var/www/certbot -d ui.skylanex.com
#
# There is deliberately no www variant: www.ui.skylanex.com has no DNS record
# and no wildcard covers it, so adding it to -d would fail validation and take
# the whole certificate request down with it.

# Cache-Control for documents, keyed on what nginx DECIDED TO SEND rather than
# on how the URL was spelled.
#
# This used to be `location ~ \.html$ { expires -1; }`, and that location never
# fired for a single visitor. Every page is requested at its canonical
# extensionless address — /app-bar, not /app-bar/index.html — and `try_files`
# resolves that to a file internally WITHOUT re-running location matching, so
# the regex block only ever matched people who typed the filename out. The
# result: 108 prerendered pages served with no Cache-Control and no Expires at
# all, which sends browsers to heuristic freshness — roughly a tenth of the
# file's age, so a page that had sat unchanged for a month was cached for days.
# A deploy would land, curl would show the new page, and the person who had
# opened it last week kept being served their own copy.
#
# Content type is the honest key: it is the same answer for /app-bar,
# /app-bar/index.html and /404.html, and it cannot be defeated by a URL form
# nobody thought of. Non-HTML maps to the empty string, and nginx omits an
# add_header whose value is empty — so /assets/ keeps its `expires 1y` and
# nothing else is touched.
map $sent_http_content_type $uib_cache_control {
    default       "";
    ~*^text/html  "no-cache";
}

# HTTP -> HTTPS. Everything redirects except the ACME challenge, which has to
# keep answering on port 80 for renewals.
server {
    listen 80;
    listen [::]:80;
    server_name ui.skylanex.com;

    # `^~` is load-bearing. nginx matches regex locations before plain prefix
    # ones, so without it the `location ~ /\.` dotfile-deny block in the HTTPS
    # server below wins this path (it starts with a dot) and every challenge
    # 404s — which is exactly what happened on the first issuance attempt.
    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }

    location / { return 301 https://ui.skylanex.com$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ui.skylanex.com;

    ssl_certificate /etc/letsencrypt/live/ui.skylanex.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ui.skylanex.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/ui-bible/dist;
    index index.html;

    server_tokens off;

    # Security headers. `always` so they are sent on error responses too.
    #
    # The CSP is written against what the built bundle actually loads: its own
    # hashed JS and CSS, self-hosted @fontsource woff2 files, and inline SVG
    # icons. Nothing is fetched cross-origin — the only external URLs in the
    # source are demo strings and links in prose.
    #
    #   style-src 'unsafe-inline'  React writes style="" attributes, and the
    #                              theme toggle sets them at runtime. Cannot be
    #                              dropped without hashing every one.
    #   img-src blob:              the file-upload demo previews a picked file
    #                              via URL.createObjectURL.
    #   script-src 'self'          the built index.html has zero inline
    #                              scripts; the entry is an external module.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data: blob:; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; media-src 'self'; connect-src 'self'" always;

    # Every HTML response, at whatever URL it was reached by, must be
    # revalidated: each one names the current asset hashes, and a stale one
    # points a browser at files that no longer exist. `always` so the 404 page
    # is covered too. The value comes from the map above and is empty for
    # everything that is not a document, which is what keeps this from
    # colliding with the `expires 1y` on /assets/.
    add_header Cache-Control $uib_cache_control always;

    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }

    # Dotfiles (.git, editor leftovers). The document root is dist/ so the
    # repo's .git is already out of reach — this is belt and braces.
    location ~ /\. {
        deny all;
        return 404;
    }

    # Vite writes content-hashed filenames into assets/, so a long max-age is
    # safe: a changed file gets a new name rather than a stale cache hit.
    #
    # `expires` alone, no add_header: nginx drops every inherited add_header
    # from a location that declares one of its own, so setting Cache-Control
    # that way here would silently strip the security headers above.
    location /assets/ {
        expires 1y;
    }

    # Path routing. Every page is prerendered to its own directory, so
    # `/button` resolves to /button/index.html as an ordinary static file and
    # no rewrite is involved.
    #
    # `=404`, not the SPA fallback this used to carry. Returning index.html for
    # an unknown path made every address on the site answer 200 — soft 404s,
    # which cost crawl budget and hide typos — and it swallowed /robots.txt and
    # /sitemap.xml, serving both as text/html. With the fallback gone those are
    # real files again, served with their own types.
    #
    # `$uri/index.html` comes FIRST, and the order is the whole point. A bare
    # `$uri` matches the DIRECTORY /button, and nginx answers a directory
    # requested without a trailing slash with a 301 to /button/ — so every
    # canonical, every sitemap entry and every internal href, all of which are
    # written without the slash, cost a redirect hop and pointed at a URL that
    # was not the one served. Naming the file explicitly serves /button at
    # /button, which is what the rest of the site claims. /button/ still works:
    # the doubled slash collapses under the default merge_slashes.
    location / {
        try_files $uri/index.html $uri =404;
    }

    # The app's own not-found page, so an unknown address still looks like the
    # Bible. nginx keeps the 404 status when it serves this internally.
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # Static docs site — nothing is uploaded.
    client_max_body_size 1m;
}
